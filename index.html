<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selector de Color RGB</title>
  
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css?v=9.0">
</head>
<body class="d-flex align-items-center min-vh-100 py-4" style="background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0f2027) !important; background-size: 400% 400% !important; animation: gradientBG 12s ease infinite !important;">

  <div class="container py-3">
    <div class="row justify-content-center">
      <div class="col-xl-9 col-lg-10">
        
        
        <div class="card main-card border-0 shadow-lg overflow-hidden" style="background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(16px); border-radius: 1.5rem;">
          
          
          <div class="card-header bg-dark text-white text-center py-3 border-0">
            <h1 class="h4 mb-0 fw-bold d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-palette-fill text-warning"></i> Selector de Color RGB
            </h1>
          </div>

          <div class="card-body p-4 p-md-5">
            <div class="row g-4 align-items-center">
              
              
              <div class="col-md-6 d-flex flex-column justify-content-center">
                
                
                <div id="colorPreview" class="preview-box rounded-4 shadow-sm mb-3" style="min-height: 240px; background-color: rgb(128, 128, 128); border: 4px solid #ffffff;"></div>

                
                <div class="text-center mb-3">
                  <div id="previewText" class="fs-3 fw-bold font-monospace text-dark">rgb(128, 128, 128)</div>
                  <small id="previewSubtext" class="text-uppercase text-muted opacity-75 letter-spacing-1 fw-bold">Color Seleccionado</small>
                </div>

                
                <div class="input-group input-group-lg shadow-sm rounded-3 overflow-hidden border">
                  <span class="input-group-text bg-white border-end-0 p-1">
                    <input type="color" id="htmlColorPicker" class="form-control form-control-color border-0 bg-transparent cursor-pointer" value="#808080" title="Seleccionar color con la paleta del sistema">
                  </span>
                  <input type="text" id="hexInput" class="form-control text-center fw-bold font-monospace border-start-0 border-end-0 bg-white fs-4" readonly value="#808080">
                  <button class="btn btn-primary px-3 px-sm-4 fw-semibold" type="button" id="copyBtn">
                    <i class="bi bi-clipboard me-1" id="copyIcon"></i>
                    <span id="copyText">Copiar</span>
                  </button>
                </div>

              </div>

              
              <div class="col-md-6 d-flex flex-column justify-content-between">
                
                
                <div class="sliders-container bg-light p-4 rounded-4 mb-3 border shadow-sm">
                  
                  
                  <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                      <label for="redRange" class="form-label text-danger fw-bold mb-0 d-flex align-items-center gap-1">
                        <i class="bi bi-droplet-fill"></i> Rojo (R)
                      </label>
                      <input type="number" id="redInput" class="form-control form-control-sm text-center fw-bold text-danger border-danger shadow-sm" min="0" max="255" value="128" style="width: 70px;">
                    </div>
                    <input type="range" class="form-range custom-slider slider-red" id="redRange" min="0" max="255" value="128">
                  </div>

                  
                  <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                      <label for="greenRange" class="form-label text-success fw-bold mb-0 d-flex align-items-center gap-1">
                        <i class="bi bi-droplet-fill"></i> Verde (G)
                      </label>
                      <input type="number" id="greenInput" class="form-control form-control-sm text-center fw-bold text-success border-success shadow-sm" min="0" max="255" value="128" style="width: 70px;">
                    </div>
                    <input type="range" class="form-range custom-slider slider-green" id="greenRange" min="0" max="255" value="128">
                  </div>

                  
                  <div class="mb-0">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                      <label for="blueRange" class="form-label text-primary fw-bold mb-0 d-flex align-items-center gap-1">
                        <i class="bi bi-droplet-fill"></i> Azul (B)
                      </label>
                      <input type="number" id="blueInput" class="form-control form-control-sm text-center fw-bold text-primary border-primary shadow-sm" min="0" max="255" value="128" style="width: 70px;">
                    </div>
                    <input type="range" class="form-range custom-slider slider-blue" id="blueRange" min="0" max="255" value="128">
                  </div>

                </div>

              </div>

            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
